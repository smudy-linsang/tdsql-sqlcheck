# TDSQL数据库SQL审核工具 v1.0.3 — Nginx 反向代理配置（可选中间件）
# 用途: TLS 终止 + 统一 443 入口。不使用 Nginx 时应用可直接以 8000 端口提供服务。
# 安装: 麒麟V10SP3 内网源 `yum install -y nginx`，本文件放至 /etc/nginx/conf.d/sqlcheck.conf
# 证书: 替换下方 ssl_certificate* 为行内签发的证书路径

server {
    listen 80;
    server_name sqlcheck.example.bank;          # 按行内域名修改
    return 301 https://$host$request_uri;       # 强制 HTTPS
}

server {
    listen 443 ssl;
    server_name sqlcheck.example.bank;

    ssl_certificate     /etc/nginx/certs/sqlcheck.crt;
    ssl_certificate_key /etc/nginx/certs/sqlcheck.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;                   # SQL文件上传上限
    gzip on;
    gzip_types text/css application/javascript application/json;

    # 长耗时接口（processlist 轮询扫描最长60s + EXPLAIN）
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # v1.6.3.4 / D05：网关大日志上传专属 location（REQ-04，DETAIL §6.7）。
    # 只为该精确路由放宽限额与超时，**不全局替换**；保留其他 location 的 20m/120s
    # 与 /metrics 访问控制。数值与应用配置对应：
    #   client_max_body_size 201m ← GATEWAY_REQUEST_MAX_BYTES（含 multipart）
    #   proxy_read/send_timeout 660s ← GATEWAY_DECLARED_PROXY_READ_TIMEOUT_SECONDS
    # 注意：client_body_timeout 是相邻读间隔（非完整上传保证）；proxy_read/send_timeout
    # 是相邻上游读/写空闲超时（非整请求硬墙钟）。应用侧另有专属字节限额兜底，直连
    # 8000 部署不依赖本配置。deployment_mode=proxy 时须先 `nginx -T` 核对生效值再 reload。
    location = /api/v1/gateway-log/upload {
        client_max_body_size 201m;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        client_body_timeout 60s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 保留默认 request buffering：会使用 Nginx 自身暂存空间，须与应用卷分别核查
        proxy_request_buffering on;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;             # 操作审计记录真实IP依赖此头
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /metrics 仅允许监控网段拉取（按行内 Prometheus 地址修改）
    location /metrics {
        allow 10.0.0.0/8;    # 示例：监控网段
        deny all;
        proxy_pass http://127.0.0.1:8000/metrics;
    }
}

# 启用 Nginx 后建议:
# 1) systemd 单元中 --host 0.0.0.0 改为 --host 127.0.0.1（仅本机回环，出口收敛到 Nginx）
# 2) firewalld 仅放通 443，收回 8000
