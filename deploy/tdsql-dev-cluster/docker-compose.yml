services:
  tdsql-zk:
    image: zookeeper:3.8
    container_name: tdsql-zk
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_STANDALONE_ENABLED: "true"
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat,conf,isro"
    deploy:
      resources:
        limits:
          memory: 256M

  tdsql-proxy:
    image: python:3.11-slim
    container_name: tdsql-proxy
    restart: unless-stopped
    ports:
      - "15002:15002"
    volumes:
      - .:/app
    command: >
      bash -c "pip install --no-cache-dir pymysql -i https://mirrors.aliyun.com/pypi/simple/ && python /app/tdsql_proxy.py"
    environment:
      TDSQL_BACKEND_HOST: "host.docker.internal"
      TDSQL_BACKEND_PORT: "13306"
      TDSQL_PROXY_PORT: "15002"
      MYSQL_ROOT_PASSWORD: "tdsql_test_2024"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 150M
