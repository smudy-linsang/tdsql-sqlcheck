[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdsql-sqlcheck"
version = "2.0.0"
description = "TDSQL SQL质量管控与慢SQL分析平台（银行级）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlglot==30.14.0",
    "pydantic>=2.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.18",
    "pymysql>=1.1.0",
    "apscheduler>=3.10.0",
    "kazoo>=2.10,<3",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    # UAT3-O-G14-01：G14 前端异步所有权行为级测试（tests/test_g14_request_ownership_browser.py）
    # 仅测试依赖，不进生产发布包（requirements.txt / Docker / 离线 wheel 仓）；
    # 浏览器二进制：优先系统 Chrome（channel=chrome），回退 playwright Chromium；
    # 测试/CI 镜像必须内置浏览器，本地缺浏览器时该测试失败关闭（不静默 skip）。
    "playwright==1.62.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
