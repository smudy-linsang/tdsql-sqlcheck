name: RBAC Browser E2E

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/e2e/**"
      - "tests/test_v3_rbac_instances.py"
      - "pyproject.toml"
      - ".github/workflows/rbac-browser-e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/e2e/**"
      - "tests/test_v3_rbac_instances.py"
      - "pyproject.toml"
      - ".github/workflows/rbac-browser-e2e.yml"
  workflow_dispatch:

jobs:
  rbac-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: tdsql_test_2024
        ports:
          - 13306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SQLCHECK_DB_HOST: 127.0.0.1
      SQLCHECK_DB_PORT: "13306"
      SQLCHECK_DB_USER: root
      SQLCHECK_DB_PASSWORD: tdsql_test_2024
      SQLCHECK_DB_NAME: tdsql_sqlcheck_test
      AUTH_ENABLED: "true"
      SCHEDULER_ENABLED: "false"
      RUN_BROWSER_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8.0" "pytest-asyncio>=0.24.0" "playwright>=1.55.0,<2"
          python -m playwright install --with-deps chromium

      - name: Run isolated RBAC API fixture tests
        run: python -m pytest tests/test_v3_rbac_instances.py -q

      - name: Run real-browser RBAC E2E
        run: python -m pytest tests/e2e/test_rbac_instances_browser.py -q
